name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Build Split per-ABI APKs
        run: flutter build apk --split-per-abi --release

      - name: Rename Universal APK
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-latest}"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/ani_mobile-${TAG_NAME}.apk"

      - name: Publish GitHub Release & Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/ani_mobile-*.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
